# ===============================================================
# timeline.yaml - 定时调度配置
# 版本：1.2.0
# 用途：每周一、周三自动运行舆情监控，其他时间静默
# ===============================================================

# 自定义调度方案："每周一/三推送"
custom:
  name: "每周一/三推送"
  description: "每周一、周三08:00启动采集，09:00推送精选舆情到微信"

  # ── 默认行为（非推送日）：只采集不推送 ──
  default:
    collect: true           # 静默采集数据（供后续分析用）
    analyze: false
    push: false
    report_mode: "incremental"
    once:
      analyze: false
      push: false

  # ── 时间段定义（积木块）──
  periods:
    # 推送日：凌晨静默采集
    pre_collect:
      name: "静默采集"
      start: "06:00"
      end: "08:00"
      collect: true
      analyze: false
      push: false
      report_mode: "incremental"

    # 推送日：上午推送（仅周一/三）
    morning_push:
      name: "早间推送"
      start: "08:00"
      end: "10:00"
      collect: true
      analyze: false
      push: true
      report_mode: "incremental"
      once:
        push: true          # 每个推送窗口只推一次

    # 推送日：晚间汇总
    evening_summary:
      name: "晚间汇总"
      start: "20:00"
      end: "22:00"
      collect: true
      analyze: false
      push: true
      report_mode: "daily"  # 当日汇总
      once:
        push: true

  # ── 日计划 ──
  day_plans:
    # 推送日（周一/三）
    push_day:
      periods: ["pre_collect", "morning_push", "evening_summary"]

    # 非推送日：全天静默
    quiet_day:
      periods: ["pre_collect"]

  # ── 周映射 ──
  week_map:
    1: "push_day"           # 周一：推送
    2: "quiet_day"          # 周二：静默
    3: "push_day"           # 周三：推送
    4: "quiet_day"          # 周四：静默
    5: "quiet_day"          # 周五：静默
    6: "quiet_day"          # 周六：静默
    7: "quiet_day"          # 周日：静默
