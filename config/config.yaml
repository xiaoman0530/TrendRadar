# ===============================================================
# TrendRadar v2.3.0 - 舆情热点监控个人定制版
# 用途：每周一/三自动扫描全网热点，按6类舆情方向筛选后微信推送
# ===============================================================

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# ===============================================================
# 2. 调度系统
# ===============================================================
schedule:
  enabled: true
  preset: "custom"          # 自定义调度，由 timeline.yaml 控制

# ===============================================================
# 3. 报告模式
# ===============================================================
report:
  mode: "incremental"       # 增量模式：只推送新增内容，不重复
  display_mode: "keyword"   # 按关键词分组显示
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 3   # 每个关键词最多显示3条

# ===============================================================
# 4. 筛选策略
# ===============================================================
filter:
  method: "keyword"         # 关键词匹配模式（零成本，不调用AI）
  priority_sort_enabled: false

# ===============================================================
# 5. 推送通知
# ===============================================================
notification:
  enabled: true

  # 推送内容区域（按需调整顺序）
  content_order:
    - hotlist
    - new_items

  channels:
    # ── WxPusher 微信推送（通过通用Webhook桥接）──
    generic_webhook:
      webhook_url: "https://wxpusher.zjiecode.com/api/send/message"
      # 占位符将在GitHub Actions运行时自动替换为真实密钥
      payload_template: '{"appToken":"WXPUSHER_TOKEN_PLACEHOLDER","content":"{content}","contentType":1,"uids":["WXPUSHER_UID_PLACEHOLDER"]}'

    # ── 飞书（备用）──
    feishu:
      webhook_url: ""

    # ── 其他渠道（暂未启用）──
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""

# ===============================================================
# 6. 数据源（仅启用中文社媒平台）
# ===============================================================
platforms:
  enabled: true
  sources:
    weibo: true             # 微博热搜
    zhihu: true             # 知乎热榜
    douyin: true            # 抖音热点
    baidu: true             # 百度热搜
    toutiao: true           # 今日头条
    bilibili: true          # B站热搜
    kuaishou: false         # 快手（暂不启用）
    xiaohongshu: false      # 小红书（暂不启用）
    tieba: false            # 百度贴吧
    thepaper: false         # 澎湃新闻
    wangyiyun: false        # 网易云音乐
    douban: false           # 豆瓣
    jinritoutiao: false     # 重复项
    wallstreetcn: false     # 华尔街见闻
    cls: false              # 财联社
    github: false
    v2ex: false
    juejin: false
    hackernews: false
    producthunt: false

# ===============================================================
# 7. RSS 订阅（暂不启用）
# ===============================================================
rss:
  enabled: false
  feeds: []

# ===============================================================
# 8. AI 功能（已关闭，避免消耗API费用）
# ===============================================================
ai:
  enabled: false

ai_filter:
  enabled: false

ai_analysis:
  enabled: false

ai_translation:
  enabled: false

# ===============================================================
# 9. 存储配置
# ===============================================================
storage:
  backend_type: "auto"      # 自动检测：GitHub Actions用S3，本地用SQLite
  local_retention_days: 30

# ===============================================================
# 10. 高级设置
# ===============================================================
advanced:
  debug: false
  crawler:
    request_interval: 2000  # 请求间隔（毫秒）
