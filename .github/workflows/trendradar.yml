name: TrendRadar 舆情监控

on:
  schedule:
    # 每周一、周三 北京时间早上8点（UTC 0:00）
    - cron: '0 0 * * 1,3'
  workflow_dispatch:  # 支持手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 uv 包管理器
        uses: astral-sh/setup-uv@v7

      - name: 安装项目依赖
        run: uv sync --frozen --no-dev

      - name: 注入 WxPusher 密钥到 config.yaml
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          uv run python -c "
          import yaml, os
          with open('config/config.yaml', 'r', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)
          token = os.environ['WXPUSHER_APP_TOKEN']
          uid = os.environ['WXPUSHER_UID']
          tpl = cfg['notification']['channels']['generic_webhook']['payload_template']
          tpl = tpl.replace('WXPUSHER_TOKEN_PLACEHOLDER', token)
          tpl = tpl.replace('WXPUSHER_UID_PLACEHOLDER', uid)
          cfg['notification']['channels']['generic_webhook']['payload_template'] = tpl
          with open('config/config.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(cfg, f, allow_unicode=True)
          print('✅ config.yaml 密钥注入完成')
          "

      - name: 运行 TrendRadar 采集+推送
        run: uv run python -m trendradar
